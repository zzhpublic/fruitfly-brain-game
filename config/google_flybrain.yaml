# Google FlyBrain / NeuPrint Integration Configuration
# Copy to config/google_flybrain.yaml and customize

# NeuPrint API Settings
neuprint:
  server: "https://neuprint.janelia.org"
  dataset: "hemibrain:v1.2.1"  # Options: hemibrain:v1.2.1, flywire_fafb:v1.0
  token: ""  # Optional: set NEUPRINT_TOKEN env var instead
  timeout: 300

# FlyWire API Settings
flywire:
  server: "https://flywire.ai"
  token: ""  # Optional: set FLYWIRE_TOKEN env var instead
  timeout: 300

# Cache Settings
cache:
  directory: "./data/flybrain_cache"
  max_size_gb: 10

# Target Regions for Visual-Motor Pathway
# Based on hemibrain cell types (not region names - hemibrain uses cell types)
target_regions:
  # Optic Lobes (visual input) - use cell types
  optic_lobes:
    - "LC"         # Lobula columnar
    - "LPLC"       # Lobula plate lobula columnar
    - "LPTC"       # Lobula plate tangential
    - "Tm"         # Transmedulla
    - "TmY"        # Transmedulla Y
    - "mALC"       # Medulla accessory lobula columnar
    - "AVLP"       # Anterior ventrolateral protocerebrum
  
  # Central Complex (navigation, motor planning)
  central_complex:
    - "PEN"        # Protocerebral bridge - ellipsoid body - noduli
    - "EPG"        # Ellipsoid body - protocerebral bridge - gall
    - "PEG"        # Protocerebral bridge - ellipsoid body - gall
    - "PFN"        # Protocerebral bridge - fan-shaped body - noduli
    - "PFL"        # Protocerebral bridge - fan-shaped body - lateral
    - "FR"         # Fan-shaped body - round body
    - "FC"         # Fan-shaped body - columnar
    - "FS"         # Fan-shaped body - stratified
    - "FB"         # Fan-shaped body neurons
    - "hDelta"     # hDelta neurons
    - "vDelta"     # vDelta neurons
  
  # Mushroom Body (learning, memory)
  mushroom_body:
    - "KC"         # Kenyon cells
    - "APL"        # Anterior paired lateral
    - "DAN"        # Dopaminergic neurons
    - "MBON"       # Mushroom body output neurons
    - "PPL"        # Protocerebral posterior lateral
    - "PAM"        # Protocerebral anterior medial
  
  # Lateral Horn (olfactory, innate behavior)
  lateral_horn:
    - "LH"         # Lateral horn neurons
    - "LHPV"       # Lateral horn projection neurons
  
  # Descending Neurons (motor output)
  descending_neurons:
    - "DNa"        # DNa type
    - "DNb"        # DNb type
    - "DNc"        # DNc type
    - "DNd"        # DNd type
    - "DNg"        # DNg type
    - "DNp"        # DNp type
    - "DN"         # Generic descending
    - "MDN"        # Moonwalker descending neuron

