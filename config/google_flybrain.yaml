# Connection Probabilities (for synthetic fallback)
# These are approximate based on literature
connection_probabilities:
  # Optic lobe -> Central complex
  "ME(R)->PB": 0.02
  "ME(L)->PB": 0.02
  "LO(R)->PB": 0.015
  "LO(L)->PB": 0.015
  "LOX(R)->PB": 0.01
  "LOX(L)->PB": 0.01
  
  # Optic lobe -> Mushroom body
  "ME(R)->MB": 0.005
  "ME(L)->MB": 0.005
  "LO(R)->MB": 0.003
  "LO(L)->MB": 0.003
  
  # Optic lobe -> Lateral horn
  "ME(R)->LH(R)": 0.01
  "ME(L)->LH(L)": 0.01
  "LO(R)->LH(R)": 0.008
  "LO(L)->LH(L)": 0.008
  
  # Central complex internal
  "PB->EB": 0.05
  "EB->FB": 0.05
  "FB->NO": 0.05
  "PB->FB": 0.03
  
  # Central complex -> Descending
  "FB->DN": 0.02
  "PB->DN": 0.015
  "EB->DN": 0.01
  
  # Mushroom body -> Descending
  "MB->DN": 0.01
  
  # Lateral horn -> Descending
  "LH(R)->DN": 0.015
  "LH(L)->DN": 0.015
  
  # Recurrent within regions
  "PB->PB": 0.03
  "EB->EB": 0.03
  "FB->FB": 0.03
  "MB->MB": 0.02
  "LH(R)->LH(R)": 0.02
  "LH(L)->LH(L)": 0.02

# Neuron Parameters by Region
neuron_params:
  optic_lobes:
    C_m: 150.0
    g_L: 12.0
    E_L: -60.0
    V_th: -40.0
    V_reset: -60.0
    t_ref: 1.5
    E_exc: 0.0
    E_inh: -75.0
  
  central_complex:
    C_m: 200.0
    g_L: 10.0
    E_L: -60.0
    V_th: -40.0
    V_reset: -60.0
    t_ref: 2.0
    E_exc: 0.0
    E_inh: -75.0
  
  mushroom_body:
    C_m: 100.0
    g_L: 8.0
    E_L: -65.0
    V_th: -45.0
    V_reset: -65.0
    t_ref: 3.0
    E_exc: 0.0
    E_inh: -80.0
  
  lateral_horn:
    C_m: 180.0
    g_L: 10.0
    E_L: -60.0
    V_th: -40.0
    V_reset: -60.0
    t_ref: 2.0
    E_exc: 0.0
    E_inh: -75.0
  
  descending_neurons:
    C_m: 300.0
    g_L: 15.0
    E_L: -55.0
    V_th: -35.0
    V_reset: -55.0
    t_ref: 1.0
    E_exc: 0.0
    E_inh: -70.0

# Neuromodulator Targets
neuromodulator_targets:
  dopamine:
    regions: ["mushroom_body", "central_complex", "lateral_horn"]
    receptors: ["D1", "D2"]
  
  octopamine:
    regions: ["optic_lobes", "central_complex", "descending_neurons"]
    receptors: ["OAMB", "Octbeta"]
  
  serotonin:
    regions: ["mushroom_body", "central_complex", "descending_neurons"]
    receptors: ["5HT1A", "5HT2A", "5HT7"]

# Download Settings
download:
  max_neurons_per_region: 2000
  max_total_neurons: 20000
  max_synapses: 1000000
  chunk_size: 5000
  parallel_requests: 4